name: assessment_app
description: "Spotly: find salons, eateries, pharmacies and more in Lagos and Abuja."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  geolocator: ^14.0.3
  shared_preferences: ^2.5.5
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  cupertino_icons: ^1.0.9
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/splash/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-400.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-500.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-600.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-700.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-800.ttf
          weight: 800

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  image_path: assets/icon/app_icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0D12"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png

# `dart run flutter_native_splash:create` regenerates the native launch
# screens. The logo is drawn at 288pt, which SplashScreen matches exactly so
# the hand-off from native to Flutter is invisible.
flutter_native_splash:
  color: "#0B0D12"
  image: assets/splash/splash_logo.png
  android_12:
    color: "#0B0D12"
    image: assets/splash/splash_logo.png
  web: false
